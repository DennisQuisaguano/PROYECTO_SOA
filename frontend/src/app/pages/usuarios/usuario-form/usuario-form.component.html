<form [formGroup]="form" (ngSubmit)="guardar()" class="uta-form">
  
  <div class="uta-form-grid">
    <div class="uta-form-group">
      <label class="uta-form-label">Nombre <span class="text-danger">*</span></label>
      <div class="uta-input-icon-wrapper">
        <i class="pi pi-id-card uta-input-icon"></i>
        <input type="text" pInputText formControlName="nombre" class="uta-form-control" 
               placeholder="NOMBRE" 
               [class.ng-invalid]="isFieldInvalid('nombre')" [class.ng-dirty]="isFieldInvalid('nombre')">
      </div>
      <div *ngIf="isFieldInvalid('nombre')" class="form-error-text">
        <small>El nombre es obligatorio</small>
      </div>
    </div>

    <div class="uta-form-group">
      <label class="uta-form-label">Apellido <span class="text-danger">*</span></label>
      <div class="uta-input-icon-wrapper">
        <i class="pi pi-id-card uta-input-icon"></i>
        <input type="text" pInputText formControlName="apellido" class="uta-form-control" 
               placeholder="APELLIDO" 
               [class.ng-invalid]="isFieldInvalid('apellido')" [class.ng-dirty]="isFieldInvalid('apellido')">
      </div>
      <div *ngIf="isFieldInvalid('apellido')" class="form-error-text">
        <small>El apellido es obligatorio</small>
      </div>
    </div>
  </div>

  <div class="uta-form-grid">
    <!-- Username -->
    <div class="uta-form-group">
      <label class="uta-form-label">Nombre de Usuario <span class="text-danger">*</span></label>
      <div class="uta-input-icon-wrapper">
        <i class="pi pi-user uta-input-icon"></i>
        <input type="text" pInputText formControlName="username" class="uta-form-control" 
               placeholder="EJ. JUAN.PEREZ"
               [class.ng-invalid]="isFieldInvalid('username')" [class.ng-dirty]="isFieldInvalid('username')">
      </div>
      <div *ngIf="isFieldInvalid('username')" class="form-error-text">
        <small *ngIf="form.get('username')?.errors?.['required']">El usuario es obligatorio</small>
        <small *ngIf="form.get('username')?.errors?.['minlength']">Mínimo 4 caracteres</small>
      </div>
    </div>

    <!-- Password -->
    <div class="uta-form-group">
      <label class="uta-form-label">
        Contraseña 
        <span class="text-muted" *ngIf="usuario">(Opcional)</span>
        <span class="text-danger" *ngIf="!usuario">*</span>
      </label>
      <div class="uta-input-icon-wrapper">
        <i class="pi pi-lock uta-input-icon"></i>
        <p-password formControlName="password" [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="uta-form-control"
                    placeholder="••••••"
                    [class.ng-invalid]="isFieldInvalid('password')" [class.ng-dirty]="isFieldInvalid('password')"></p-password>
      </div>
      <div *ngIf="isFieldInvalid('password')" class="form-error-text">
        <small *ngIf="form.get('password')?.errors?.['required']">La contraseña es obligatoria</small>
        <small *ngIf="form.get('password')?.errors?.['minlength']">Mínimo 6 caracteres</small>
      </div>
    </div>
  </div>

  <div class="uta-form-grid">
    <!-- Rol -->
    <div class="uta-form-group">
      <label class="uta-form-label">Rol del Sistema <span class="text-danger">*</span></label>
      <p-dropdown [options]="roles" formControlName="rolId" optionLabel="nombre" optionValue="id" 
                  placeholder="Seleccione un rol" styleClass="uta-dropdown-control"
                  [class.ng-invalid]="isFieldInvalid('rolId')" [class.ng-dirty]="isFieldInvalid('rolId')"></p-dropdown>
      <div *ngIf="isFieldInvalid('rolId')" class="form-error-text">
        <small>Debe asignar un rol</small>
      </div>
    </div>

    <!-- Teléfono -->
    <div class="uta-form-group">
      <label class="uta-form-label">Teléfono (10 dígitos)</label>
      <div class="uta-input-icon-wrapper">
        <i class="pi pi-phone uta-input-icon"></i>
        <input type="text" pInputText formControlName="telefono" class="uta-form-control" 
               placeholder="ej: 0987654321" maxlength="10"
               [class.is-invalid]="isFieldInvalid('telefono')" [class.ng-dirty]="isFieldInvalid('telefono')">
      </div>
      <div *ngIf="isFieldInvalid('telefono')" class="form-error-text">
        <small>Debe tener exactamente 10 dígitos</small>
      </div>
    </div>
  </div>

  <div class="uta-form-grid">
    <!-- Sucursal -->
    <div class="uta-form-group">
      <label class="uta-form-label">Sucursal Asignada</label>
      <p-dropdown [options]="sucursales" formControlName="sucursalId" optionLabel="nombre" optionValue="id" 
                  [showClear]="true" placeholder="Todas (Para ADMIN)" styleClass="uta-dropdown-control"></p-dropdown>
    </div>
  </div>

  <!-- Estado -->
  <div class="uta-form-group mt-3" *ngIf="usuario">
    <div class="flex align-items-center">
      <p-checkbox formControlName="activo" [binary]="true" inputId="activo"></p-checkbox>
      <label for="activo" class="uta-form-label-checkbox m-0 cursor-pointer">
        Usuario habilitado para entrar al sistema
      </label>
    </div>
  </div>

  <!-- Buttons -->
  <div class="uta-modal__footer">
    <button type="button" class="uta-btn uta-btn--outline" (click)="onCancelar()">Cancelar</button>
    <button type="submit" class="uta-btn uta-btn--primary" [disabled]="form.invalid || form.pristine || loading">
      <i class="pi pi-check" *ngIf="!loading"></i>
      <i class="pi pi-spin pi-spinner" *ngIf="loading"></i>
      &nbsp;{{ usuario ? 'Guardar Cambios' : 'Crear Usuario' }}
    </button>
  </div>
</form>

<p-confirmDialog [style]="{width: '450px'}" styleClass="premium-dialog"></p-confirmDialog>
