<div class="uta-bg-wrapper">
  <div class="uta-login-container">
    <div class="uta-login-card">
      
      <!-- Header with Logo -->
      <div class="uta-login-header">
        <div class="uta-login-logo">
          <i class="bi bi-shop"></i>
        </div>
        <h1 class="uta-login-title">MI NEGOCIO</h1>
        <p class="uta-login-subtitle">Acceso seguro a la plataforma</p>
      </div>

      <!-- Form Section -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="uta-login-form">
        <!-- Username Field -->
        <div class="uta-form-group">
          <label for="username" class="uta-form-label">Usuario</label>
          <div class="uta-input-wrapper">
            <i class="bi bi-person uta-input-icon"></i>
            <input 
              pInputText 
              id="username" 
              formControlName="username" 
              class="uta-form-control" 
              placeholder="Ingrese su usuario"
              [class.shake-animation]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" 
            />
          </div>
          <small *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required']" class="form-error-text">
            El usuario es obligatorio
          </small>
        </div>

        <!-- Password Field -->
        <div class="uta-form-group">
          <label for="password" class="uta-form-label">Contraseña</label>
          <div class="uta-input-wrapper">
            <i class="bi bi-lock uta-input-icon"></i>
            <p-password 
              id="password" 
              formControlName="password" 
              [feedback]="false" 
              [toggleMask]="true" 
              styleClass="w-full" 
              inputStyleClass="uta-form-control-password"
              placeholder="Ingrese su contraseña"
              [class.shake-animation]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            ></p-password>
          </div>
          <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="form-error-text">
            La contraseña es obligatoria
          </small>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="uta-login-btn" [disabled]="loading">
          <i class="bi bi-arrow-repeat spin-loader" *ngIf="loading"></i>
          <i class="bi bi-box-arrow-in-right" *ngIf="!loading"></i>
          <span>{{ loading ? 'Ingresando...' : 'Ingresar' }}</span>
        </button>

        <!-- Footer Text -->
        <div class="secure-footer">
          <i class="bi bi-shield-lock-fill"></i>
          <span>Conexión segura SSL</span>
        </div>
      </form>
      
    </div>
  </div>
</div>
