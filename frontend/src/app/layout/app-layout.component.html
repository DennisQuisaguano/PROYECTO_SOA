<div class="layout-wrapper">
  <p-toast position="top-right"></p-toast>
  <div class="layout-sidebar" [class.collapsed]="!sidebarVisible">
    <app-sidebar [collapsed]="!sidebarVisible"></app-sidebar>
  </div>

  <div class="layout-main">
    <app-topbar [sidebarVisible]="sidebarVisible" (toggleSidebar)="toggleSidebar()"></app-topbar>

    <main class="layout-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
